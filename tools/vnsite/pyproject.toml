[project]
name = "client-api-vnsite"
version = "3.0.0rc1"
description = "Manage Client_API_VN Docker Compose site deployments."
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
]

[project.scripts]
vnsite = "vnsite.cli:main"

[tool.poetry]
packages = [
  { include = "vnsite", from = "src" },
]
include = [
  { path = "src/vnsite/data", format = ["sdist", "wheel"] },
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"