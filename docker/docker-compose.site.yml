# Production stack for ONE site (e.g. faune79), talking to an external
# PostgreSQL/PostGIS server that is NOT managed by this compose file
# (see docs/apps/server_install.md). Only environment variables and
# host connectivity are handled here; there is no "db" service.
#
# Usage (one directory per site, each with its own docker-compose.yml + .env):
#   mkdir -p ~/sites/faune79 && cd ~/sites/faune79
#   cp /path/to/docker-compose.site.yml docker-compose.yml
#   cp /path/to/.env.example .env       # then edit SITE, UID/GID and database settings
#
#   # One-off: generate the config file (container exits immediately)
#   docker compose run --rm app transfer_vn --init /app/config/.env_${SITE}.toml
#   # => edit the generated TOML on the host, then set the db host to
#   #    host.docker.internal (works on Linux/macOS/Windows thanks to extra_hosts)
#
#   docker compose up -d          # start the long-running container
#   docker compose exec app bash  # interactive shell
services:
  app:
    image: ${IMAGE}
    container_name: ${SITE}_vn
    restart: unless-stopped
    user: "${APP_UID}:${APP_GID}"
    environment:
      HOME: /app
      TERM: xterm-256color
    # Lets the container reach a PostgreSQL server running on the host,
    # regardless of OS (use "host.docker.internal" as db host in the TOML config).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    volumes:
      - ./data:/app/VN_files
      - ./logs:/app/tmp
      - ./config:/app/config
    command: sleep infinity
